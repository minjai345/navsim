# TruckScenes-specific training launcher for TruckDiffusionDriveAgent.
#
# Differences from default_training_truck.yaml:
#   - Default agent = truck_diffusiondrive_agent
#   - lr default = 1e-4 (DiffusionDrive convention, lower than TransFuser)
#   - max_epochs = 100 (DiffusionDrive's longer schedule; v9
#     TransFuser used 48; can override on CLI)
#
# Other parameters (train/val log split, scene_filter, batch size,
# DDP strategy, fp16 precision) inherit from the truck baseline yaml.
#
# Launch (after build_navsim_logs --materialize-blobs has finished and
# the k-means anchor has been generated):
#
#   python navsim/planning/script/run_training.py \
#       --config-name default_training_truck_diffusiondrive \
#       experiment_name=truck_diffusiondrive_seed0 \
#       train_test_split=truckscenes_mini \
#       navsim_log_path=<pkls> sensor_blobs_path=<blobs>

hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - truckscenes_train_val_log_split
  - agent: truck_diffusiondrive_agent
  - _self_

split: trainval
cache_path: ${oc.env:NAVSIM_EXP_ROOT}/training_cache
use_cache_without_dataset: false
force_cache_computation: true
seed: 0

dataloader:
  params:
    batch_size: 16
    num_workers: 16
    pin_memory: true
    prefetch_factor: 2

# Weights & Biases logging. Disable with wandb.enable=false on CLI.
wandb:
  enable: true
  project: truck_navsim_pdms
  entity: null
  tags: []

trainer:
  params:
    max_epochs: 100
    check_val_every_n_epoch: 1
    val_check_interval: 1.0

    limit_train_batches: 1.0
    limit_val_batches: 1.0

    accelerator: gpu
    strategy: ddp
    precision: 16-mixed
    num_nodes: 1

    num_sanity_val_steps: 0
    fast_dev_run: false

    accumulate_grad_batches: 1
    gradient_clip_val: 0.0
    gradient_clip_algorithm: norm
    default_root_dir: ${output_dir}
