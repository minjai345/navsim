# Tiny TruckScenes split for sanity / smoke testing.
#
# Intended use: after running
#   python -m navsim.common.truckscenes.build_navsim_logs \
#       --truckscenes-root $TRUCKSCENES --version v1.2-trainval \
#       --output-dir <pkls> --materialize-blobs --blob-dir <blobs> \
#       --max-scenes 2
#
# launch training with this split + the two scene tokens supplied via
# train_logs / val_logs (override on CLI):
#
#   python navsim/planning/script/run_training.py \
#       agent=truck_transfuser_agent \
#       train_test_split=truckscenes_mini \
#       navsim_log_path=<pkls> sensor_blobs_path=<blobs> \
#       train_logs="[<token1>,<token2>]" val_logs="[<token1>]" ...
#
# `data_split` only feeds the default `navsim_log_path` / `sensor_blobs_path`
# templates -- overriding those on CLI bypasses the template.
defaults:
  - scene_filter: truckscenes

data_split: trainval
